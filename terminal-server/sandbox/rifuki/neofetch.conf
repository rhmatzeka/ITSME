# neofetch ala dotfiles rifuki (logo Miku), disesuaikan untuk kontainer tamu:
# OS ditulis Mats OS, bagian desktop (DE/WM/tema/GPU) dibuang — tidak ada di sini.
# Tiap baris paling panjang ±40 kolom, supaya di HP (tanpa logo) tidak terlipat.
print_info() {
    info title
    info underline
    prin "OS" "Mats OS 1.0 (Debian 12 sandbox)"
    prin "Host" "Rahmat's computer, Desa Mapporto"
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    prin "Terminal" "RAHMAT-PC (ttyd)"
    # gVisor tidak memberi tahu nama CPU-nya ("unknown (2) @ 2.499GHz")
    prin "CPU" "$(nproc) vCPU, gVisor sandbox"
    info "Memory" memory
    prin "Disk (~)" "$(df -h "$HOME" | awk 'NR==2{print $3" / "$2}')"
    prin "Owner" "Rahmat Eka Satria"
    prin "Role" "Full-Stack: Web, Mobile & Web3"
    info cols
}
kernel_shorthand="on"
uptime_shorthand="on"
memory_unit="mib"
package_managers="on"
shell_version="on"
cpu_brand="on"
cpu_cores="logical"
colors=(6 6 7 6 6 7)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"
block_range=(0 15)
image_backend="ascii"
image_source="/etc/mapporto/miku.txt"
ascii_colors=(6 6 6 6 6 6)
