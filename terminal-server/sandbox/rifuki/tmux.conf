# tmux pengunjung — tmux.conf dotfiles rifuki (shared/.config/tmux), versi
# kontainer: keybind, mouse, dan tema catppuccin frappe sama; tanpa TPM,
# tanpa modul CPU/baterai/jaringan (tidak ada internet, CPU dijatah), dan
# scrollback kecil karena satu sesi cuma dapat 96 MB. Dipasang sebagai
# /etc/tmux.conf, jadi `tmux` langsung memakainya.
unbind r
bind r source-file /etc/tmux.conf \; display-message 'Configuration Reloaded!'

set -g extended-keys
set -g prefix C-b                   # Set prefix to Ctrl + b
set -g mouse on                     # Enable native tmux mouse support
unbind-key -n WheelUpPane
unbind-key -n WheelDownPane
bind-key -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode}}" "send-keys -M" "copy-mode -e"
set -g base-index 1                 # Start window numbering from 1
set -g renumber-windows on          # Auto-renumber windows after closing one
set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm-256color:RGB"
set -g escape-time 10
set -g history-limit 5000
set -g status-interval 5
set -g focus-events on
setw -g mode-keys vi                # Enable Vi keybindings in copy mode

bind-key h select-pane -L   # Move to the left pane
bind-key j select-pane -D   # Move to the bottom pane
bind-key k select-pane -U   # Move to the top pane
bind-key l select-pane -R   # Move to the right pane
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

set-hook -g pane-focus-in  "select-pane -T '#{?#{==:#{pane_title},},#{b:pane_current_path},#{pane_title}}'"
set-hook -g pane-focus-out "select-pane -T '#{?#{==:#{pane_title},},#{b:pane_current_path},#{pane_title}}'"

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_default_text " #W "
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_text " #W"
run '/usr/share/mapporto-tmux/catppuccin/catppuccin.tmux'

set -g status-left ""
set -g status-right-length 80
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
